<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="{{ICON_192}}" />
    <link rel="apple-touch-icon" sizes="180x180" href="{{APPLE_ICON}}" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="{{HEADER_LIGHT}}" />
    
    <!-- SEO Meta Tags -->
    <title>{{NAME}}</title>
    <meta name="description" content="{{DESCRIPTION}}" />
    
    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="{{NAME}}" />
    <meta property="og:description" content="{{DESCRIPTION}}" />
    <meta property="og:image" content="{{SHARE_IMAGE}}" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="{{SHARE_IMAGE}}" />
    
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json?v={{VERSION}}" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="{{SHORT_NAME}}" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet" />
    
    <!-- Theme initialization (prevents flash) -->
    <script>
      (function() {
        var theme = localStorage.getItem('pwa_theme_preference');
        if (!theme) {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.content = theme === 'dark' ? '{{HEADER_DARK}}' : '{{HEADER_LIGHT}}';
        var statusBar = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
        if (statusBar) statusBar.content = theme === 'dark' ? 'black-translucent' : 'default';
      })();
    </script>

    <!-- Language initialization (public app; admin stays English). Same logic as LanguageContext. -->
    <script>
      (function() {
        try {
          var lang = localStorage.getItem('chamber_lang');
          if (lang !== 'en' && lang !== 'es') {
            lang = (navigator.language || '').toLowerCase().indexOf('es') === 0 ? 'es' : 'en';
          }
          if (location.pathname.indexOf('/admin') !== 0) {
            document.documentElement.setAttribute('lang', lang);
          }
        } catch (e) {}
      })();
    </script>
    
    <!-- Gravitec Push Notifications (added by index.php when the App Key is set up) -->
    <!--{{GRAVITEC}}-->
    <script type="module" crossorigin src="/assets/index-D55pe8NY.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-D6cUln5c.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
